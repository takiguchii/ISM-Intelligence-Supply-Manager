# Usar junto com docker-compose.yml após preencher as variáveis do WhatsApp.
services:
  whatsapp:
    image: devlikeapro/waha@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHATSAPP_PORT:-3001}:3000"
    environment:
      WAHA_API_KEY: ${WHATSAPP_API_KEY:?Defina WHATSAPP_API_KEY no .env antes de iniciar o WhatsApp}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WHATSAPP_DASHBOARD_USERNAME:-ism}
      WAHA_DASHBOARD_PASSWORD: ${WHATSAPP_DASHBOARD_PASSWORD:?Defina WHATSAPP_DASHBOARD_PASSWORD no .env}
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WAHA_LOG_LEVEL: warn
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes:
      - whatsapp_sessions:/app/.sessions
    networks:
      - ism-network
volumes:
  whatsapp_sessions:
